<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý khóa học</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/admin.js}"></script>
</head>
<body>
<header class="navbar">
    <a class="brand" th:href="@{/courses}">CodePath<span>Tư vấn khóa học lập trình</span></a>
    <div class="account">
        <span class="badge">Quản trị viên</span>
        <a class="button secondary" th:href="@{/courses}">Xem trang khóa học</a>
        <form th:action="@{/api/auth/logout}" method="post">
            <button class="button secondary" type="submit">Đăng xuất</button>
        </form>
    </div>
</header>
<nav class="site-nav" aria-label="Điều hướng quản trị">
    <a th:href="@{/admin/bookings}">Lịch tư vấn</a>
    <a th:href="@{/admin/courses}" aria-current="page">Khóa học</a>
    <a th:href="@{/admin/consultants}">Tư vấn viên</a>
    <a th:href="@{/admin/slots}">Khung giờ</a>
    <a th:href="@{/admin/applications}">Duyệt hồ sơ</a>
</nav>

<main class="container">
    <h1>Quản lý khóa học</h1>

    <p role="status"
       th:if="${successMessage != null}"
       th:text="${successMessage}">
    </p>

    <section class="card login-card">
        <h2>Thêm khóa học</h2>

        <form th:action="@{/admin/courses/{id}/edit(id=${courseId})}"
              th:object="${courseForm}"
              method="post">

            <div class="error"
                 role="alert"
                 th:if="${#fields.hasAnyErrors()}">
                <p th:each="error : ${#fields.allErrors()}"
                   th:text="${error}">
                </p>
            </div>

            <label for="name">Tên khóa học</label>
            <input id="name"
                   type="text"
                   th:field="*{name}"
                   maxlength="150"
                   required>

            <label for="description">Mô tả</label>
            <textarea id="description"
                      th:field="*{description}"
                      rows="4"></textarea>

            <label for="prerequisites">Kiến thức đầu vào</label>
            <textarea id="prerequisites"
                      th:field="*{prerequisites}"
                      rows="3"></textarea>

            <label for="durationWeeks">Số tuần học</label>
            <input id="durationWeeks"
                   type="number"
                   th:field="*{durationWeeks}"
                   min="1"
                   required>

            <button class="button full" type="submit">
                Sửa khóa học
            </button>
            <a class="back" th:href="@{/admin/courses}">
                ← Quay lại quản lý khóa học
            </a>
        </form>
</main>
</body>
</html>
