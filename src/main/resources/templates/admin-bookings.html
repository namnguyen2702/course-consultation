<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Quản lý lịch tư vấn</title>

  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="navbar">
  <a class="brand" th:href="@{/courses}">CodePath</a>
  <span class="badge">Quản trị viên</span>
</header>

<main class="container">
  <p role="status"
     th:if="${successMessage != null}"
     th:text="${successMessage}">
  </p>

  <p class="error"
     role="alert"
     th:if="${errorMessage != null}"
     th:text="${errorMessage}">
  </p>
  <section class="hero">
    <h1>Quản lý lịch tư vấn</h1>
    <p>Danh sách lịch của tất cả khách hàng · Giờ Việt Nam.</p>
  </section>

  <p class="empty" th:if="${#lists.isEmpty(bookings)}">
    Chưa có lịch tư vấn nào.
  </p>

  <section class="grid">
    <article class="card"
             th:each="booking : ${bookings}">

      <h3 th:text="${booking.customerName()}"></h3>

      <p th:text="${booking.customerEmail()}"></p>

      <p>
        Mã lịch:
        <strong th:text="${booking.id()}"></strong>
      </p>

      <p>
        Khóa học:
        <strong th:text="${booking.courseName()}"></strong>
      </p>

      <p>
        Tư vấn viên:
        <span th:text="${booking.consultantName()}"></span>
      </p>

      <p th:text="${booking.startAt().format(
                T(java.time.format.DateTimeFormatter)
                    .ofPattern('dd/MM/yyyy HH:mm')
            )}"></p>

      <p>
        Kết thúc:
        <span th:text="${booking.endAt().toLocalTime()}"></span>
      </p>

      <span class="badge" th:switch="${booking.status()}">
                <span th:case="'CONFIRMED'">Đã xác nhận</span>
                <span th:case="'CANCELLED'">Đã hủy</span>
                <span th:case="'COMPLETED'">Đã hoàn thành</span>
                <span th:case="'NO_SHOW'">Vắng mặt</span>
                <span th:case="*" th:text="${booking.status()}"></span>
            </span>
      <form th:if="${booking.status() == 'CONFIRMED'}"
            th:action="@{/admin/bookings/{id}/status(id=${booking.id()})}"
            method="post"
            onsubmit="return confirm('Bạn có chắc muốn ghi nhận kết quả này?');">

        <label th:for="${'status-' + booking.id()}">
          Kết quả buổi tư vấn
        </label>

        <select th:id="${'status-' + booking.id()}"
                name="status"
                required>
          <option value="">Chọn kết quả</option>
          <option value="COMPLETED">Đã hoàn thành</option>
          <option value="NO_SHOW">Khách vắng mặt</option>
        </select>

        <p>Chỉ cập nhật sau khi buổi tư vấn kết thúc.</p>

        <button class="button" type="submit">
          Lưu kết quả
        </button>
      </form>
    </article>
  </section>

  <a class="back" th:href="@{/courses}">
    ← Quay lại khóa học
  </a>
</main>
</body>
</html>
