<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | CodePath</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="navbar"><a class="brand" th:href="@{/courses}">CodePath<span>Tư vấn khóa học lập trình</span></a></header>
<main class="login-wrap">
    <section class="card login-card">
        <p class="eyebrow">TÀI KHOẢN CỦA BẠN</p>
        <h1>Đăng nhập</h1>
        <p>Tiếp tục với tài khoản bạn đã đăng ký.</p>
        <p class="error" role="alert" th:if="${param.error != null}">Email hoặc mật khẩu không đúng. Vui lòng thử lại.</p>
        <p role="status"
           th:if="${successMessage != null}"
           th:text="${successMessage}">
        </p>
        <form th:action="@{/api/auth/login}" method="post">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required maxlength="150">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="button full" type="submit">Đăng nhập</button>
        </form>
        <a class="back" th:href="@{/register}">
            Chưa có tài khoản? Đăng ký
        </a>
        <br>
        <a class="back" th:href="@{/courses}">← Xem các khóa học</a>
    </section>
</main>
</body>
</html>
