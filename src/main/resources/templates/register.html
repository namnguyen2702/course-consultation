<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Đăng ký | CodePath</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="navbar">
    <a class="brand" th:href="@{/courses}">CodePath</a>
</header>

<main class="login-wrap">
    <section class="card login-card">
        <h1>Tạo tài khoản</h1>

        <p>Đăng ký để đặt lịch tư vấn khóa học.</p>

        <p class="error"
           role="alert"
           th:if="${errorMessage != null}"
           th:text="${errorMessage}">
        </p>

        <form th:action="@{/register}" method="post">
            <label for="fullName">Họ tên</label>
            <input id="fullName"
                   name="fullName"
                   type="text"
                   autocomplete="name"
                   maxlength="100"
                   required>

            <label for="email">Email</label>
            <input id="email"
                   name="email"
                   type="email"
                   autocomplete="email"
                   maxlength="150"
                   required>

            <label for="password">Mật khẩu</label>
            <input id="password"
                   name="password"
                   type="password"
                   autocomplete="new-password"
                   minlength="8"
                   maxlength="72"
                   required>

            <p>Mật khẩu từ 8 đến 72 ký tự, tối đa 72 byte UTF-8.</p>

            <button class="button full" type="submit">
                Đăng ký
            </button>
        </form>

        <a class="back" th:href="@{/login}">
            Đã có tài khoản? Đăng nhập
        </a>
    </section>
</main>
</body>
</html>
