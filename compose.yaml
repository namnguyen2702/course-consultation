services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: course_consultation
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: local_course_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data: